<!doctype html>
<html lang="ja" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "ZKG"; font-weight: 900; src: url("assets/fonts/ZenKakuGothicNew_900Black.ttf"); }
      @font-face { font-family: "ZKG"; font-weight: 700; src: url("assets/fonts/ZenKakuGothicNew_700Bold.ttf"); }
      @font-face { font-family: "ZKG"; font-weight: 500; src: url("assets/fonts/ZenKakuGothicNew_500Medium.ttf"); }
      @font-face { font-family: "MS"; font-weight: 800; src: url("assets/fonts/Montserrat_800ExtraBold.ttf"); }
      @font-face { font-family: "MS"; font-weight: 700; src: url("assets/fonts/Montserrat_700Bold.ttf"); }
      :root {
        --navy: #0c2242;
        --navy2: #173a6a;
        --red: #c8102e;
        --red2: #e0243f;
        --ink: #0c1a2e;
        --white: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root {
        position: relative; width: 1080px; height: 1920px;
        font-family: "ZKG", sans-serif; font-feature-settings: "palt" 1;
      }
      .abs { position: absolute; }

      /* ---- 上部：番組ロゴ ---- */
      #bug { left: 64px; top: 112px; }
      #bugIn { display: flex; align-items: stretch; height: 78px;
        box-shadow: 0 6px 18px rgba(0,0,0,.28); }
      #bugMark { width: 16px; background: var(--red); }
      #bugBox { background: linear-gradient(180deg, #13305a 0%, var(--navy) 100%);
        display: flex; align-items: center; gap: 14px; padding: 0 26px 0 22px; }
      #bugJa { color: #fff; font-weight: 900; font-size: 38px; letter-spacing: .02em; }
      #bugEn { color: #fff; font-family: "MS"; font-weight: 800; font-size: 30px; letter-spacing: .14em;
        padding-left: 14px; border-left: 2px solid rgba(255,255,255,.35); line-height: 1; }
      #src { left: 64px; top: 204px; }
      #srcIn { background: rgba(8,20,40,.62); color: #fff; font-weight: 700; font-size: 28px;
        padding: 8px 16px; letter-spacing: .06em; }

      /* ---- 上部右：LIVE ---- */
      #live { right: 64px; top: 112px; }
      #liveIn { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
      #livePill { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 22px 0 18px;
        background: var(--red); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
      #liveDot { width: 16px; height: 16px; border-radius: 50%; background: #fff; }
      #liveTxt { color: #fff; font-family: "MS"; font-weight: 800; font-size: 30px; letter-spacing: .12em; }
      #liveTime { background: rgba(8,20,40,.62); color: #fff; font-family: "MS"; font-weight: 700;
        font-size: 28px; letter-spacing: .06em; padding: 7px 14px; }

      /* ---- 下：テロップ ---- */
      #lt { left: 60px; top: 1292px; width: 960px; }
      #tab { position: relative; display: inline-flex; align-items: center; height: 66px; padding: 0 30px;
        background: linear-gradient(180deg, var(--red2) 0%, var(--red) 100%); }
      .tabTxt { color: #fff; font-weight: 900; font-size: 40px; letter-spacing: .16em; line-height: 1; }
      #tabMask { position: relative; height: 40px; overflow: hidden; }
      #tabMask .tabTxt { display: block; }
      #tab2 { position: absolute; left: 0; top: 0; }
      #hbox { position: relative; width: 960px; height: 228px; overflow: hidden;
        background: linear-gradient(180deg, #ffffff 0%, #eef1f5 100%);
        box-shadow: 0 10px 28px rgba(0,0,0,.30); }
      #hbox::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--navy); }
      .head { position: absolute; left: 50px; top: 26px; right: 30px; }
      .hl { display: block; color: var(--ink); font-weight: 900; font-size: 78px; line-height: 88px;
        letter-spacing: .01em; white-space: nowrap; }
      .em { color: var(--red); }
      #sub { position: relative; width: 960px; height: 76px; overflow: hidden;
        background: linear-gradient(90deg, var(--navy) 0%, var(--navy2) 100%); }
      .st { position: absolute; left: 50px; top: 0; height: 76px; display: flex; align-items: center;
        color: #fff; font-weight: 700; font-size: 36px; letter-spacing: .04em; white-space: nowrap; }

      /* ---- 速報の導入 ---- */
      #flash { left: 0; top: 1292px; width: 1080px; height: 370px; }
      #flashBar { position: absolute; left: 0; top: 60px; width: 1080px; height: 250px;
        background: linear-gradient(180deg, var(--red2) 0%, var(--red) 100%); transform-origin: 0 50%; }
      #flashTxt { position: absolute; left: 0; top: 60px; width: 1080px; height: 250px; display: flex;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      #flashJa { color: #fff; font-weight: 900; font-size: 140px; letter-spacing: .3em; margin-right: -.3em; line-height: 1; }
      #flashEn { color: rgba(255,255,255,.9); font-family: "MS"; font-weight: 800; font-size: 30px;
        letter-spacing: .6em; margin-right: -.6em; line-height: 1; }
      #flashLine { position: absolute; left: 0; top: 60px; width: 1080px; height: 6px; background: #fff; transform-origin: 0 50%; }

      /* ---- ティッカー ---- */
      #tk { left: 0; top: 1700px; width: 1080px; height: 74px; }
      #tkIn { position: relative; width: 1080px; height: 74px; display: flex;
        background: rgba(8,20,40,.86); box-shadow: 0 -2px 0 var(--red) inset; }
      #tkLabel { flex: none; width: 176px; height: 74px; display: flex; align-items: center; justify-content: center;
        background: var(--red); color: #fff; font-family: "MS"; font-weight: 800; font-size: 30px; letter-spacing: .14em; }
      #tkView { position: relative; flex: 1; height: 74px; overflow: hidden; }
      #tkTxt { position: absolute; left: 0; top: 0; height: 74px; display: flex; align-items: center;
        color: #fff; font-weight: 700; font-size: 34px; letter-spacing: .04em; white-space: nowrap; }
      .sq { color: var(--red2); margin-right: 14px; }
      .gap { display: inline-block; width: 90px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.33" data-width="1080" data-height="1920"
         data-layout-allow-overflow data-layout-allow-overlap>

      <div id="bug" class="abs clip" data-start="0" data-duration="25.33" data-track-index="0">
        <div id="bugIn"><div id="bugMark"></div><div id="bugBox"><span id="bugJa">ほうかご</span><span id="bugEn">NEWS</span></div></div>
      </div>
      <div id="src" class="abs clip" data-start="0" data-duration="25.33" data-track-index="1">
        <div id="srcIn">視聴者提供</div>
      </div>
      <div id="live" class="abs clip" data-start="0" data-duration="25.33" data-track-index="2">
        <div id="liveIn">
          <div id="livePill"><div id="liveDot"></div><span id="liveTxt">LIVE</span></div>
          <div id="liveTime">9.11 20:48</div>
        </div>
      </div>

      <div id="lt" class="abs clip" data-start="0" data-duration="25.33" data-track-index="3">
        <div id="tab"><div id="tabMask"><span id="tab1" class="tabTxt">速報</span><span id="tab2" class="tabTxt">続報</span></div></div>
        <div id="hbox">
          <div id="h1" class="head"><span class="hl">教室の窓際で</span><span class="hl">男子学生2人が<span class="em">もみ合い</span></span></div>
          <div id="h2" class="head"><span class="hl">カメラが接近</span><span class="hl"><span class="em">激しい攻防</span>をとらえた</span></div>
          <div id="h3" class="head"><span class="hl">1人が<span class="em">脱出</span></span><span class="hl">しかし再び接近か</span></div>
        </div>
        <div id="sub">
          <div id="s1" class="st">現場から映像でお伝えします</div>
          <div id="s2" class="st">両者とも笑顔　けが人の情報はなし</div>
          <div id="s3" class="st">引き続き情報が入り次第お伝えします</div>
        </div>
      </div>

      <div id="flash" class="abs clip" data-start="0" data-duration="1.6" data-track-index="4">
        <div id="flashBar"></div>
        <div id="flashTxt"><span id="flashJa">速報</span><span id="flashEn">BREAKING</span></div>
        <div id="flashLine"></div>
      </div>

      <div id="tk" class="abs clip" data-start="0" data-duration="25.33" data-track-index="5">
        <div id="tkIn">
          <div id="tkLabel">NEWS</div>
          <div id="tkView"><div id="tkTxt"><span class="sq">■</span>窓際の攻防　発生から20秒以上が経過<span class="gap"></span><span class="sq">■</span>教室内の天気　晴れのち混戦<span class="gap"></span><span class="sq">■</span>専門家「いつものことです」<span class="gap"></span><span class="sq">■</span>この映像は視聴者から提供されました<span class="gap"></span><span class="sq">■</span>窓際の攻防　発生から20秒以上が経過<span class="gap"></span><span class="sq">■</span>教室内の天気　晴れのち混戦<span class="gap"></span><span class="sq">■</span>専門家「いつものことです」<span class="gap"></span><span class="sq">■</span>この映像は視聴者から提供されました</div></div>
        </div>
      </div>
    </div>
    <script>
      const T_END = 25.33, T2 = 10.9, T3 = 20.6;
      const tl = gsap.timeline({ paused: true });

      // 初期状態
      gsap.set(["#bugIn", "#srcIn", "#liveIn", "#tkIn"], { opacity: 0 });
      gsap.set("#tab", { clipPath: "inset(0% 100% 0% 0%)" });
      gsap.set("#hbox", { clipPath: "inset(0% 100% 0% 0%)" });
      gsap.set("#sub", { clipPath: "inset(0% 100% 0% 0%)" });
      gsap.set(["#h2", "#h3"], { yPercent: 0, opacity: 0 });
      gsap.set(["#s2", "#s3"], { opacity: 0 });
      gsap.set("#tab2", { yPercent: 110 });
      gsap.set("#flashBar", { scaleX: 0 });
      gsap.set("#flashLine", { scaleX: 0 });
      gsap.set("#flash", { clipPath: "inset(0% 0% 0% 0%)" });
      gsap.set(["#flashJa", "#flashEn"], { opacity: 0 });

      // ---- 速報の導入（0〜1.6秒）
      tl.to("#flashBar", { scaleX: 1, duration: 0.42, ease: "expo.out" }, 0.08);
      tl.to("#flashLine", { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.14);
      tl.fromTo("#flashJa", { opacity: 0, scale: 1.18, filter: "blur(10px)" },
                { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, 0.2);
      tl.fromTo("#flashEn", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.to("#flash", { clipPath: "inset(0% 0% 0% 100%)", duration: 0.42, ease: "power3.inOut" }, 1.05);

      // ---- テロップの枠が出る
      tl.to("#tab", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.out" }, 1.1);
      tl.to("#hbox", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, 1.12);
      tl.fromTo("#h1 .hl", { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "power3.out", stagger: 0.09 }, 1.3);
      tl.to("#sub", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.inOut" }, 1.3);
      tl.fromTo("#s1", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.55);

      // ---- 上部とティッカー
      tl.fromTo("#bugIn", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.5);
      tl.fromTo("#liveIn", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.62);
      tl.fromTo("#srcIn", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9);
      tl.fromTo("#tkIn", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.45);
      // ティッカーは一定の速さで流す（ニュースの字幕帯の慣習）
      tl.fromTo("#tkTxt", { x: 904 }, { x: -2900, duration: T_END - 1.6, ease: "none" }, 1.6);
      // LIVE の点の明滅（有限回）
      tl.to("#liveDot", { opacity: 0.2, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 41 }, 0.8);

      // ---- 見出しの切り替え
      function swap(t, from, to, sFrom, sTo) {
        tl.to(`${from} .hl`, { yPercent: -100, opacity: 0, duration: 0.3, ease: "power2.in", stagger: 0.05 }, t);
        tl.set(to, { opacity: 1 }, t + 0.3);
        tl.fromTo(`${to} .hl`, { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.09 }, t + 0.32);
        tl.to(sFrom, { opacity: 0, x: 24, duration: 0.25, ease: "power2.in" }, t + 0.05);
        tl.fromTo(sTo, { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, t + 0.42);
      }
      swap(T2 - 0.15, "#h1", "#h2", "#s1", "#s2");
      tl.to("#tab1", { yPercent: -110, duration: 0.4, ease: "power3.inOut" }, T2 - 0.15);
      tl.to("#tab2", { yPercent: 0, duration: 0.4, ease: "power3.inOut" }, T2 - 0.15);
      swap(T3 - 0.15, "#h2", "#h3", "#s2", "#s3");

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
